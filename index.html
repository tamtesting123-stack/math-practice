<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a1a;
    --text-muted: #777;
    --text-faint: #aaa;
    --green-bg: #EAF3DE;
    --green-text: #27500A;
    --green-border: #97C459;
    --red-bg: #FCEBEB;
    --red-text: #791F1F;
    --red-border: #F09595;
    --teal-bg: #E1F5EE;
    --teal-text: #085041;
    --teal-border: #5DCAA5;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 99px;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  .page {
    width: 100%;
    max-width: 560px;
  }

  .app-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }

  .app-subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }

  .stat-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
  }

  .stat-val {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }

  .stat-lbl {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  .topic-bar {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .topic-btn {
    padding: 7px 15px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .topic-btn:hover { background: #f0f0ea; }

  .topic-btn.active {
    background: var(--teal-bg);
    border-color: var(--teal-border);
    color: var(--teal-text);
  }

  .streak-row {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin-bottom: 1.25rem;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
  }
  .dot.hit { background: #5DCAA5; }
  .dot.miss { background: #F09595; }

  .q-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    text-align: center;
    margin-bottom: 1rem;
  }

  .q-type-label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  .q-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    min-height: 18px;
  }

  .choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 320px;
    margin: 0 auto;
  }

  .choice-btn {
    padding: 16px;
    border-radius: var(--radius-sm);
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }

  .choice-btn:hover:not(:disabled) { background: #f5f5f0; }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
  .choice-btn.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }

  .ans-input {
    width: 100px;
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .ans-input:focus { border-color: #5DCAA5; }
  .ans-input.correct { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
  .ans-input.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }

  .check-btn {
    padding: 11px 20px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }

  .check-btn:hover:not(:disabled) { background: #f0f0ea; }
  .check-btn:disabled { cursor: default; color: var(--text-faint); }

  .feedback-box {
    margin-top: 1.25rem;
    padding: 13px 16px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    min-height: 46px;
  }

  .feedback-box.correct { background: var(--green-bg); color: var(--green-text); border: 0.5px solid var(--green-border); }
  .feedback-box.wrong   { background: var(--red-bg); color: var(--red-text); border: 0.5px solid var(--red-border); }
  .feedback-box.empty   { background: transparent; }

  .next-btn {
    display: none;
    width: 100%;
    max-width: 300px;
    margin: 1rem auto 0;
    padding: 13px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }

  .next-btn:hover { background: #f0f0ea; }

  .progress-line {
    font-size: 13px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 8px;
    min-height: 18px;
  }

  @media (max-width: 480px) {
    .app-title { font-size: 22px; }
    .q-text { font-size: 26px; }
    .choice-btn { font-size: 17px; padding: 13px; }
  }
</style>
</head>
<body>
<div class="page">
  <h1 class="app-title">Math practice</h1>
  <p class="app-subtitle">Pick your topics and get started!</p>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="score">0</div><div class="stat-lbl">Correct</div></div>
    <div class="stat-card"><div class="stat-val" id="total">0</div><div class="stat-lbl">Answered</div></div>
    <div class="stat-card"><div class="stat-val" id="streak">0</div><div class="stat-lbl">Streak</div></div>
  </div>

  <div class="topic-bar" id="topic-bar"></div>
  <div class="streak-row" id="streak-row"></div>

  <div class="q-card">
    <div class="q-type-label" id="q-type"></div>
    <div class="q-text" id="q-text">Loading...</div>
    <div class="q-hint" id="q-hint"></div>
    <div id="answer-area"></div>
    <div class="feedback-box empty" id="feedback"></div>
    <div style="display:flex;justify-content:center">
      <button class="next-btn" id="next-btn" onclick="nextQ()">Next question &rarr;</button>
    </div>
  </div>

  <div class="progress-line" id="progress"></div>
</div>

<script>
const topics = [
  {id:'add',  label:'Addition',       active:true},
  {id:'sub',  label:'Subtraction',    active:true},
  {id:'mul',  label:'Multiplication', active:true},
  {id:'div',  label:'Division',       active:true},
  {id:'word', label:'Word problems',  active:false},
];

let S = {score:0, total:0, streak:0, history:[], answered:false, q:null};

const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];

const animals = ['cats','dogs','frogs','birds','fish','rabbits','turtles','penguins'];
const things  = ['apples','cookies','balloons','stars','books','crayons','stickers','marbles'];

function genQ(tid) {
  if(tid==='add'){
    const a=rnd(1,99),b=rnd(1,Math.min(99-a,50));
    return {type:'Addition', text:`${a} + ${b} = ?`, ans:a+b, hint:'Add the two numbers together', mode:'input'};
  }
  if(tid==='sub'){
    const a=rnd(10,99),b=rnd(1,a);
    return {type:'Subtraction', text:`${a} \u2212 ${b} = ?`, ans:a-b, hint:'Take the second number away from the first', mode:'input'};
  }
  if(tid==='mul'){
    const a=rnd(2,10),b=rnd(2,10);
    return {type:'Multiplication', text:`${a} \u00D7 ${b} = ?`, ans:a*b, hint:`Count by ${a}s, ${b} times`, mode:'choices'};
  }
  if(tid==='div'){
    const b=rnd(2,9),a=b*rnd(2,9);
    return {type:'Division', text:`${a} \u00F7 ${b} = ?`, ans:a/b, hint:`What times ${b} equals ${a}?`, mode:'choices'};
  }
  if(tid==='word'){
    const fns = [
      ()=>{ const a=rnd(2,9),b=rnd(2,9),an=pick(animals); return {text:`There are ${a} ${an} and ${b} more join them. How many ${an} are there?`,ans:a+b,hint:'Think: start + more = total'}; },
      ()=>{ const t=rnd(10,20),g=rnd(2,t-1),th=pick(things); return {text:`You have ${t} ${th}. You give ${g} away. How many are left?`,ans:t-g,hint:'Think: total \u2212 given away'}; },
      ()=>{ const bags=rnd(2,6),each=rnd(2,8),th=pick(things); return {text:`There are ${bags} bags with ${each} ${th} each. How many ${th} total?`,ans:bags*each,hint:`${bags} groups of ${each}`}; },
      ()=>{ const s=rnd(2,5),e=rnd(2,6),t=s*e,th=pick(things); return {text:`${t} ${th} shared equally among ${s} friends. How many each?`,ans:t/s,hint:`Split ${t} into ${s} equal groups`}; },
    ];
    const f=pick(fns)();
    return {type:'Word problem', text:f.text, ans:f.ans, hint:f.hint, mode:'input'};
  }
}

function makeChoices(correct) {
  const s=new Set([correct]);
  let tries=0;
  while(s.size<4 && tries<50){
    tries++;
    const v=correct+rnd(-6,6);
    if(v>0 && v!==correct) s.add(v);
  }
  return [...s].sort(()=>Math.random()-0.5);
}

function renderTopics(){
  const bar=document.getElementById('topic-bar');
  bar.innerHTML='';
  topics.forEach(t=>{
    const b=document.createElement('button');
    b.className='topic-btn'+(t.active?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ t.active=!t.active; renderTopics(); };
    bar.appendChild(b);
  });
}

function renderDots(){
  const row=document.getElementById('streak-row');
  const last=S.history.slice(-10);
  row.innerHTML='';
  for(let i=0;i<10;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<last.length?(last[i]?' hit':' miss'):'');
    row.appendChild(d);
  }
}

function nextQ(){
  const active=topics.filter(t=>t.active);
  if(!active.length){
    document.getElementById('q-text').textContent='Pick a topic above!';
    document.getElementById('q-type').textContent='';
    document.getElementById('q-hint').textContent='';
    document.getElementById('answer-area').innerHTML='';
    setFeedback('','empty');
    document.getElementById('next-btn').style.display='none';
    return;
  }
  const t=pick(active);
  S.q=genQ(t.id);
  S.answered=false;

  document.getElementById('q-type').textContent=S.q.type;
  document.getElementById('q-text').textContent=S.q.text;
  document.getElementById('q-hint').textContent=S.q.hint;
  setFeedback('','empty');
  document.getElementById('next-btn').style.display='none';

  const area=document.getElementById('answer-area');
  if(S.q.mode==='choices'){
    const choices=makeChoices(S.q.ans);
    area.innerHTML='<div class="choices-grid" id="cg"></div>';
    choices.forEach(c=>{
      const b=document.createElement('button');
      b.className='choice-btn';
      b.textContent=c;
      b.onclick=()=>checkChoice(c,b);
      document.getElementById('cg').appendChild(b);
    });
  } else {
    area.innerHTML='<div class="input-row"><input class="ans-input" id="ai" type="number" placeholder="?" /><button class="check-btn" id="cb" onclick="checkInput()">Check</button></div>';
    const inp=document.getElementById('ai');
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') checkInput(); });
    setTimeout(()=>inp&&inp.focus(),50);
  }
}

const okMsgs=['Great job!','Awesome!','You got it!','Perfect!','Brilliant!','Spot on!','Way to go!','Fantastic!'];
const noMsgs=['Good try! The answer is ','Not quite \u2014 it\'s ','Almost! The answer is ','Keep going! It\'s '];

function setFeedback(msg, cls){
  const fb=document.getElementById('feedback');
  fb.className='feedback-box '+cls;
  fb.textContent=msg;
}

function afterAnswer(correct){
  S.answered=true; S.total++;
  if(correct){ S.score++; S.streak++; S.history.push(true); setFeedback(pick(okMsgs),'correct'); }
  else        { S.streak=0;            S.history.push(false);setFeedback(pick(noMsgs)+S.q.ans,'wrong'); }
  document.getElementById('score').textContent=S.score;
  document.getElementById('total').textContent=S.total;
  document.getElementById('streak').textContent=S.streak;
  const pct=Math.round(S.score/S.total*100);
  document.getElementById('progress').textContent=`${pct}% accuracy across ${S.total} question${S.total!==1?'s':''}`;
  renderDots();
  document.getElementById('next-btn').style.display='block';
}

function checkChoice(val,btn){
  if(S.answered) return;
  document.querySelectorAll('.choice-btn').forEach(b=>{ b.disabled=true; if(Number(b.textContent)===S.q.ans) b.classList.add('correct'); });
  if(val===S.q.ans) btn.classList.add('correct'); else btn.classList.add('wrong');
  afterAnswer(val===S.q.ans);
}

function checkInput(){
  if(S.answered) return;
  const inp=document.getElementById('ai');
  if(!inp||inp.value==='') return;
  const val=parseInt(inp.value);
  inp.disabled=true;
  document.getElementById('cb').disabled=true;
  const correct=val===S.q.ans;
  inp.classList.add(correct?'correct':'wrong');
  afterAnswer(correct);
}

renderTopics();
renderDots();
nextQ();
</script>
</body>
</html>
